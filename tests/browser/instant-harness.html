<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>
  // Statamic stub: enough for dock-instant-preview.js to boot without the CP.
  window.__handlers = {};
  window.__paneHtml = '';
  window.Statamic = {
    $config: {
      get: function (k) {
        // A test may hand in a compiler module (window.__twCompileUrl): the
        // Tailwind dock is then on, as on a site with the bake.
        return {
          sveFeatures: { template_dock: true, tailwind_dock: !!window.__twCompileUrl },
          sveTwCompile: window.__twCompileUrl || '',
          sveSectionField: 'page_sections',
        }[k];
      },
    },
    $events: {
      $on: function (name, cb) { (window.__handlers[name] = window.__handlers[name] || []).push(cb); },
    },
    booting: function (cb) { cb(); },
  };
  window.__emit = function (name, payload) { (window.__handlers[name] || []).forEach(function (cb) { cb(payload); }); };
</script>
</head>
<body>
<div class="live-preview">
  <div id="__sve-code-dock">
    <span data-sve-code-path>resources/views/partials/page_sections/other_section/employees_list_2.antlers.html</span>
    <div data-sve-code-pane="html"><div class="cm-content"></div></div>
    <div data-sve-code-pane="css"><div class="cm-content"></div></div>
  </div>
  <iframe id="live-preview-iframe" style="width:900px;height:600px"></iframe>
</div>
<script>
  // The panes read the editor state, not the DOM (memory: CodeMirror only draws the visible lines).
  var html = document.querySelector('[data-sve-code-pane="html"] .cm-content');
  var css = document.querySelector('[data-sve-code-pane="css"] .cm-content');
  // The HTML caret (window.__paneCaret): where the strip's lists and the completion list look for their tag.
  html.cmTile = { view: { state: { doc: { toString: function () { return window.__paneHtml; } }, selection: { main: { get head() { return window.__paneCaret || 0; } } } } } };
  css.cmTile = { view: { state: { doc: { toString: function () { return window.__paneCss || ''; } } } } };
</script>
<script src="SCRIPT_SRC"></script>
</body>
</html>
