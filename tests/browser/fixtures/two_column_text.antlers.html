<section id="id-{{ id }}" class="wrapper py-1000 bg-gray-800 text-gray-50 flex flex-wrap gap-x-900 gap-y-400" {{ visual_edit outline_inside="true" section_orderable="true" }}>
  <div {{ visual_edit inline_edit="true" field="section_heading" }} class="basis-[35rem] grow flow-y flow-space-100">
    {{ section_heading }}
  </div>
  <div {{ visual_edit inline_edit="true" field="text" }} class="basis-0 grow-[999] min-w-1/2 flow-y text-current/70 text-200">
    {{ text }}
  </div>
</section>
