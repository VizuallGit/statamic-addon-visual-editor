tabs:
  main:
    display: Settings
    sections:
      -
        fields:
          -
            handle: enabled
            field:
              type: toggle
              display: Enable Visual Editor
              instructions: 'Inject the bridge script into Live Preview responses and enable click-to-edit functionality. With this off there is no editor to configure, so the rest of this screen is hidden — nothing below is forgotten, it just has nothing to act on.'
              default: true
      -
        display: Toolbar
        instructions: 'The icon row at the top left of Live Preview. Switch off what this site has no use for — a hidden tool is one nobody has to be told to ignore.'
        fields:
          -
            handle: panel
            field:
              type: toggle
              display: 'Page settings panel'
              instructions: 'The side panel with Hide/Auto/Show and the entry''s own tabs (Main, SEO, Sidebar).'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: page_activity
            field:
              type: toggle
              display: 'Edit history'
              instructions: 'An icon in the Live Preview top bar that opens this page''s revision list. It uses Statamic''s own revisions, not a separate log. Off, the icon is gone.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: page_activity_access
            field:
              type: toolbar_access
              hide_display: true
              tool: page_activity
              if:
                enabled: 'equals true'
                page_activity: 'equals true'
          -
            handle: breakpoint_overview
            field:
              type: toggle
              display: 'All screen sizes'
              instructions: 'A button in the Live Preview top bar, next to zoom, that shows every screen size side by side as live pages — to look at, not to edit. Nothing is loaded until it is clicked. Off, the button is gone.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: site_canvas
            field:
              type: toggle
              display: 'Site canvas (demo)'
              instructions: 'A button in the Live Preview top bar that lays the site''s templates and pages out as frames on one canvas — pan, zoom, and click a frame to edit that page. Nothing is loaded until it is clicked. Off by default while it is a demo.'
              default: false
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: build_mode
            field:
              type: toggle
              display: 'Build mode (preview)'
              instructions: 'A Content | Build switch in the middle of the Live Preview top bar. Build shows Add and Style for the picked element in the left column, in place of the fields, and writes the HTML dock''s file. Choose below who gets it: they get the HTML dock with it, and only in Build. Without Build, Live Preview is Content only, with no switch. Needs Edit section templates on. Nothing is loaded until Build is chosen. Off by default while it is a preview.'
              default: false
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: build_mode_access
            field:
              type: toolbar_access
              hide_display: true
              tool: build_mode
              if:
                enabled: 'equals true'
                build_mode: 'equals true'
          -
            handle: pages
            field:
              type: toggle
              display: Pages
              instructions: 'Switch between pages, and create new ones, without leaving Live Preview.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: pages_access
            field:
              type: toolbar_access
              hide_display: true
              tool: pages
              if:
                enabled: 'equals true'
                pages: 'equals true'
          -
            handle: globals
            field:
              type: toggle
              display: Globals
              instructions: 'Open a global set (Theme Settings and the like) beside the preview.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: globals_access
            field:
              type: toolbar_access
              hide_display: true
              tool: globals
              if:
                enabled: 'equals true'
                globals: 'equals true'
          -
            handle: globals_picker
            field:
              type: globals_picker
              display: 'Shown in the Globals menu'
              instructions: 'Which global sets the globe menu lists in Live Preview. Header and footer are off by default — they are still opened by clicking them on the page. Turn a set on here if you want it in the menu on this site.'
              if:
                enabled: 'equals true'
                globals: 'equals true'
          -
            handle: sections
            field:
              type: toggle
              display: 'Section library'
              instructions: 'The panel sections are dragged onto the page from. Off hides its tabs below as well.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: sections_access
            field:
              type: toolbar_access
              hide_display: true
              tool: sections
              if:
                enabled: 'equals true'
                sections: 'equals true'
          -
            handle: listview
            field:
              type: toggle
              display: 'Block tree'
              instructions: 'The page as a tree of sections and blocks, docked on the right.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: listview_access
            field:
              type: toolbar_access
              hide_display: true
              tool: listview
              if:
                enabled: 'equals true'
                listview: 'equals true'
          -
            handle: outline
            field:
              type: toggle
              display: 'Heading outline'
              instructions: 'The page''s headings as one list, docked on the right — the structure a reader, a screen reader or a search engine meets, rather than the sections it was built from. Clicking one scrolls the preview to it and opens the block it sits in.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: outline_access
            field:
              type: toolbar_access
              hide_display: true
              tool: outline
              if:
                enabled: 'equals true'
                outline: 'equals true'
          -
            handle: performance
            field:
              type: toggle
              display: Performance
              instructions: 'What the page weighs, docked on the right. Loads the public address in a frame of its own — not Live Preview, which carries the editor with it — and reports total weight, weight per kind, the vitals the browser recorded, and every image that is heavier or larger than the box it sits in.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: performance_access
            field:
              type: toolbar_access
              hide_display: true
              tool: performance
              if:
                enabled: 'equals true'
                performance: 'equals true'
          -
            handle: psi
            field:
              type: toggle
              display: 'Google PageSpeed'
              instructions: 'A fourth tab in the Performance panel: the page run through Google PageSpeed Insights, with the score, the lab metrics and — where the page has enough visitors — what real Chrome users met over the last 28 days. Google has to be able to reach the address, so it stays quiet on a .test domain or a site behind a password. Off by default.'
              default: false
              width: 50
              if:
                enabled: 'equals true'
                performance: 'equals true'
          -
            handle: psi_api_key
            field:
              type: text
              display: 'PageSpeed API key'
              input_type: password
              instructions: 'In practice you need one. Without a key the request goes on a small shared quota that is usually already spent by somebody else, and Google answers "quota exceeded" instead of a score. The key is free: console.cloud.google.com, enable the PageSpeed Insights API, create an API key. If you leave this empty, PAGESPEED_API_KEY in .env is used instead.'
              if:
                enabled: 'equals true'
                performance: 'equals true'
                psi: 'equals true'
          -
            handle: xray
            field:
              type: toggle
              display: 'X-ray'
              instructions: 'A switch in the Live Preview top bar that draws the layout over the page the way browser DevTools do: grid tracks with numbered lines, hatched gaps and empty cells, subgrids, flex rows, spacing, font style and overflow — sizes named by the theme tokens they are. Only drawn in Live Preview, never on the site.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: design_overlay
            field:
              type: toggle
              display: 'Design overlay'
              instructions: 'A switch in the Live Preview top bar that lays a design screenshot (JPG, PNG or WebP) over the page, with its own opacity and a difference view. One image per page and screen size; a size without one shows nothing. Kept in storage/statamic-visual-editor/design-overlays and shown only to signed-in Control Panel users.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: html_tree
            field:
              type: toggle
              display: 'HTML tree'
              instructions: 'The HTML tags in the template dock, as a tree in the right sidebar. Own toolbar icon — not the block tree. Click a tag to jump to it in the HTML pane.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: html_tree_access
            field:
              type: toolbar_access
              hide_display: true
              tool: html_tree
              if:
                enabled: 'equals true'
                html_tree: 'equals true'
          -
            handle: schema
            field:
              type: toggle
              display: 'Structured data'
              instructions: 'An icon in the Live Preview toolbar for schema.org JSON-LD — the block search engines read to understand what a page is (a business with an address and opening hours, an article, a list of questions). Two levels: one for the site, on every page, and one for the page you are on. It is written in just before `</body>` on the rendered site; it is never shown to a visitor and never touches a blueprint. Off by default.'
              default: false
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: schema_access
            field:
              type: toolbar_access
              hide_display: true
              tool: schema
              if:
                enabled: 'equals true'
                schema: 'equals true'
          -
            handle: bard_styles
            field:
              type: toggle
              display: 'Bard styles'
              instructions: 'An icon in the Live Preview top bar that makes and changes the styles and style groups Bard''s toolbar offers (Title, the size dropdown, flow spacing …). Needs the bard-style addon, v1.1 or newer; without it there is no icon. Off, the icon is gone.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: bard_styles_access
            field:
              type: toolbar_access
              hide_display: true
              tool: bard_styles
              if:
                enabled: 'equals true'
                bard_styles: 'equals true'
          -
            handle: comments
            field:
              type: toggle
              display: Comments
              instructions: 'Figma-style pins in Live Preview.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: comments_access
            field:
              type: toolbar_access
              hide_display: true
              tool: comments
              if:
                enabled: 'equals true'
                comments: 'equals true'
      -
        display: 'Top bar: Content and Build'
        instructions: 'The icons each mode of Live Preview may have. An icon that is not ticked for a mode is not there in that mode — not in the top bar, not under ⋮ → Top bar, not on a keyboard shortcut. Someone without Build mode is always in Content. Within its mode, each editor shows, hides and groups the icons for themselves; Page settings always stands first on its own, and an icon a user has no access to stays away whatever is ticked here. The HTML dock is not on either list: it is always in Build and never in Content.'
        fields:
          -
            handle: toolbar_preset_editor_tools
            field:
              type: checkboxes
              display: 'Content: icons'
              options:
                pages: 'Pages'
                globals: 'Globals'
                collections: 'Collections'
                forms: 'Forms'
                templates: 'Templates'
                blueprint: 'Blueprint'
                bard_styles: 'Bard styles'
                sections: 'Patterns'
                listview: 'Block tree'
                outline: 'Accessibility'
                performance: 'Performance'
                site_css: 'Stylesheets'
                theme: 'Theme'
                xray: 'X-ray'
                design_overlay: 'Design overlay'
                site_canvas: 'Site canvas'
                ai: 'AI'
                aitext: 'AI text'
                schema: 'Structured data'
                edits: 'Edit history'
                comments: 'Comments'
              default:
                - pages
                - globals
                - collections
                - forms
                - sections
                - listview
                - outline
                - ai
                - aitext
                - edits
                - comments
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: toolbar_preset_developer_tools
            field:
              type: checkboxes
              display: 'Build: icons'
              options:
                pages: 'Pages'
                globals: 'Globals'
                collections: 'Collections'
                forms: 'Forms'
                templates: 'Templates'
                blueprint: 'Blueprint'
                bard_styles: 'Bard styles'
                sections: 'Patterns'
                listview: 'Block tree'
                outline: 'Accessibility'
                performance: 'Performance'
                site_css: 'Stylesheets'
                theme: 'Theme'
                xray: 'X-ray'
                design_overlay: 'Design overlay'
                site_canvas: 'Site canvas'
                ai: 'AI'
                aitext: 'AI text'
                schema: 'Structured data'
                edits: 'Edit history'
                comments: 'Comments'
              default:
                - pages
                - globals
                - collections
                - forms
                - templates
                - blueprint
                - bard_styles
                - sections
                - listview
                - outline
                - performance
                - site_css
                - theme
                - xray
                - design_overlay
                - site_canvas
                - ai
                - aitext
                - schema
                - edits
                - comments
              width: 50
              if:
                enabled: 'equals true'
                build_mode: 'equals true'
      -
        display: 'Keyboard shortcuts'
        instructions: 'A shortcut does exactly what a click on the icon does, and pressing it again closes what it opened — a hidden icon stays hidden. ⌘ on a Mac, Ctrl on Windows. Greyed out is the built-in shortcut, which applies until you record one here; Backspace while recording means none. This is the site''s default: every editor can change their own in Live Preview under ⋮ → Shortcuts. A screen size''s shortcut is set on its row under Screen sizes.'
        fields:
          -
            handle: shortcuts
            field:
              type: sve_shortcuts
              hide_display: true
              if:
                enabled: 'equals true'
      -
        display: 'Editing on the page'
        fields:
          -
            handle: inline_edit
            field:
              type: toggle
              display: 'Inline editing'
              instructions: 'Click text in the preview and type straight into it. Off, the `inline_edit` flag on your `visual_edit` tags stops taking effect — a click focuses the field in the side panel instead, the way an unflagged field already behaves. Your templates stay as they are.'
              default: true
              if:
                enabled: 'equals true'
          -
            handle: template_dock
            field:
              type: toggle
              display: 'Edit section templates'
              instructions: 'When a section is selected, a bottom panel opens the section''s Antlers file. Saving writes the file on this server. Off by default. The dock is only in Build mode: whoever has Build has the dock, and no one else — choose them under Build mode.'
              default: false
              if:
                enabled: 'equals true'
          -
            handle: site_css
            field:
              type: toggle
              display: 'Site CSS'
              instructions: 'An icon in Live Preview that opens this site''s stylesheets (`resources/css`). Saving writes the file on this server. Off by default. Super admins see the icon unless you name specific people — same as the section template dock.'
              default: false
              if:
                enabled: 'equals true'
          -
            handle: site_css_access
            field:
              type: toolbar_access
              hide_display: true
              tool: site_css
              if:
                enabled: 'equals true'
                site_css: 'equals true'
          -
            handle: file_manager
            field:
              type: toggle
              display: 'Site files'
              instructions: 'A page under Utilities that browses and edits this site''s own code files — `resources/views`, `resources/css`, `resources/js`, `resources/lang` — with new file, new folder and delete. Saving writes on this server. `app`, `routes`, `config`, `.env` and `vendor` are never reachable. Off by default. Super admins unless you name specific people.'
              default: false
              if:
                enabled: 'equals true'
          -
            handle: file_manager_access
            field:
              type: toolbar_access
              hide_display: true
              tool: file_manager
              if:
                enabled: 'equals true'
                file_manager: 'equals true'
          -
            handle: live_reload
            field:
              type: toggle
              display: 'Live reload'
              instructions: 'A button on the public site, under Rediger, that reloads the page when this site''s files change on the server — a template saved from VS Code over SSH, Site Files or the dock. CSS and JS are built on the server first (as the Stylesheets panel does), so new Tailwind classes show too. Click the button to switch it off in your browser. Not while `npm run dev` runs: Vite reloads the page itself then. Off by default. Super admins unless you name specific people.'
              default: false
              if:
                enabled: 'equals true'
          -
            handle: live_reload_access
            field:
              type: toolbar_access
              hide_display: true
              tool: live_reload
              if:
                enabled: 'equals true'
                live_reload: 'equals true'
          -
            handle: live_reload_instant
            field:
              type: toggle
              display: 'Live reload: paint the saved file at once'
              instructions: 'In Live Preview, a section partial saved outside the editor (Cursor over SSH) is painted into the preview in the same way the HTML pane paints — about a quarter of a second — when that section''s file is open in the dock. Off: the preview is only rendered again by the server (one to two seconds), which is lighter for the browser and the server. The sync itself is on whenever Live reload is on.'
              default: false
              if:
                enabled: 'equals true'
                live_reload: 'equals true'
          -
            handle: collection_templates
            field:
              type: toggle
              display: 'Collection templates'
              instructions: 'After Scaffold Views, Index and Show become templates you open in Live Preview. You can also apply a preset you keep in VS Code (blueprint + views) — the collection name does not matter. Off by default — a site that only needs the page builder can leave this off.'
              default: false
              if:
                enabled: 'equals true'
          -
            handle: tailwind_dock
            field:
              type: toggle
              display: 'Tailwind in the template dock'
              instructions: 'Suggestions in the HTML pane (like `md:text-900`) from this site’s theme. Compiled CSS is stored under `resources/visual-editor/tw`, not in the Antlers file. Does not change `site.css` or `npm run dev`. Off, the dock saves exactly as it does today. Needs the template dock.'
              default: false
              if:
                enabled: 'equals true'
                template_dock: 'equals true'
          -
            handle: component_props
            field:
              type: toggle
              display: 'Fields on components'
              instructions: 'A component declares what it takes — a name, a kind (text, media, rich text) and a default — edited above the tree while the component is open. Each place it is used then gets those fields in the panel, so the same card can say something different in every section. The declaration is an Antlers comment in the component file, so a rendered page never reads it. Off by default; off again and the file renders exactly as before. Needs the template dock.'
              default: false
              if:
                enabled: 'equals true'
                template_dock: 'equals true'
          -
            handle: component_props_buttons
            field:
              type: bard_buttons_setting
              display: 'Rich text buttons'
              instructions: 'What a rich text field on a component offers. The same picker Bard itself uses, so anything Bard can do is on the list. Left empty, the set below is what you get.'
              full_width_setting: true
              default:
                - h2
                - h3
                - bold
                - italic
                - underline
                - strikethrough
                - unorderedlist
                - orderedlist
                - anchor
                - removeformat
              if:
                enabled: 'equals true'
                template_dock: 'equals true'
                component_props: 'equals true'
          -
            handle: ghost_provider
            field:
              type: button_group
              display: 'AI runs on'
              instructions: 'One choice for every AI in the editor — the AI chat, AI text and the AI in the HTML dock. Cursor: your Cursor account''s key; the dock gives its instant suggestions, and asks the AI only for a comment and ⌘K (Cursor takes many seconds). Claude: a Claude API key, paid per use — the dock''s grey text in a second or two, the AI chat and AI text on Claude too.'
              default: cursor
              options:
                cursor: Cursor
                claude: Claude
              if_any:
                ai_panel: 'equals true'
                ai_text: 'equals true'
                dock_ghost: 'equals true'
          -
            handle: ai_api_key
            field:
              type: text
              display: 'Cursor API key'
              input_type: password
              always_save: true
              instructions: 'Paste it here, from cursor.com/dashboard/api. If you leave it empty, CURSOR_API_KEY in .env is used instead.'
              if:
                enabled: 'equals true'
                ghost_provider: 'equals cursor'
          -
            handle: ghost_api_key
            field:
              type: text
              display: 'Claude API key'
              input_type: password
              always_save: true
              instructions: 'From console.anthropic.com — a Claude Console account, paid per use; a claude.ai Pro or Max subscription does not give one. If you leave it empty, ANTHROPIC_API_KEY in .env is used instead.'
              if:
                enabled: 'equals true'
                ghost_provider: 'equals claude'
          -
            handle: ai_panel
            field:
              type: toggle
              display: 'AI chat'
              instructions: 'A chat in Live Preview that builds and changes sections, on the AI picked above. Off by default.'
              default: false
              if:
                enabled: 'equals true'
          -
            handle: ai_panel_access
            field:
              type: toolbar_access
              hide_display: true
              tool: ai_panel
              if:
                enabled: 'equals true'
                ai_panel: 'equals true'
          -
            handle: ai_text
            field:
              type: toggle
              display: 'AI text'
              instructions: 'An icon in the Live Preview toolbar. Turn it on and every editable text on the page gets a small mark — click it and the AI suggests copy written against the page''s keywords (the Keywords field in SEO/meta) with the site''s keywords as background. It only ever suggests; nothing is written until you pick one. On the AI picked above. Off by default.'
              default: false
              if:
                enabled: 'equals true'
          -
            handle: ai_text_access
            field:
              type: toolbar_access
              hide_display: true
              tool: ai_text
              if:
                enabled: 'equals true'
                ai_text: 'equals true'
          -
            handle: dock_ghost
            field:
              type: toggle
              display: 'AI in the HTML dock (grey text and ⌘K)'
              instructions: 'Copilot-style help while you write in the template dock''s HTML pane. Grey text at the caret, written against the section''s fields, the site''s colours and classes, the house rules and your newest sections: Tab takes it, Esc or typing on leaves it. The common moves — a loop over a list, an item''s fields, visual_edit, the classes of the same element — come at once and free; the rest from the AI picked above. Write a comment such as `{{# card: image left, text right #}}` and press Enter, and it writes the block. Select markup and press ⌘K to change it in your own words (Enter keeps, Esc undoes). Each person switches it on with the sparkle in the pane. Off by default.'
              default: false
              if:
                enabled: 'equals true'
                template_dock: 'equals true'
          -
            handle: ai_model
            field:
              type: text
              display: 'Default AI model'
              instructions: 'The model a new chat starts with, and the one AI text uses. On Cursor: empty is Auto (Cursor picks), or a model id such as `grok-4.7` or `composer-2.5`. On Claude: `claude-opus-5-5` (the default when empty), `claude-sonnet-5-5` (half the price) or `claude-haiku-5-5` (the cheapest). Each chat can pick another model in the panel.'
              placeholder: default
              if_any:
                ai_panel: 'equals true'
                ai_text: 'equals true'
          -
            handle: ai_project_rules
            field:
              type: toggle
              display: 'Let the AI read this project''s rules'
              instructions: 'Hands Cursor the repository''s own `.cursor/rules`, `AGENTS.md` and MCP servers — the same context the developer''s editor uses. Off, it only knows the rules in `resources/visual-editor/ai-rules.md`, which is how it has always worked. Rules meant for something else (addon development, deployment) will be sent along as well, so keep an eye on what is in there. Cursor only.'
              default: false
              if:
                enabled: 'equals true'
                ai_panel: 'equals true'
                ghost_provider: 'equals cursor'
      -
        display: 'Opening an entry'
        instructions: 'Ways into Live Preview from the Control Panel. The entry title always opens the publish form, as Statamic ships; these add a second door beside it.'
        fields:
          -
            handle: open_in_preview
            field:
              type: toggle
              display: '"Open in Live Preview" on rows'
              instructions: 'Every row of the named collections — in the listing and in the page tree — gets a small "Open in Live Preview" label beside the title. The label opens the entry in Live Preview; closing it brings you back to the list. The title itself still opens the form.'
              default: false
              if:
                enabled: 'equals true'
          -
            handle: open_in_preview_collections
            field:
              type: sve_preview_collections
              display: Collections
              instructions: 'Only these. A collection left out here shows no label, which is what you want for the ones that are records rather than pages. A collection without a URL is listed last, greyed out, and cannot be chosen: there is no page to render, so there would be nothing to open.'
              if:
                enabled: 'equals true'
                open_in_preview: 'equals true'
          -
            handle: home_preview_button
            field:
              type: toggle
              display: 'Live Preview button in the top bar'
              instructions: 'A Live Preview button in the Control Panel''s top bar, on every page, that opens the site''s front page in Live Preview. Stays away when there is no entry at `/` or you may not edit it.'
              default: true
              if:
                enabled: 'equals true'
      -
        display: 'Section library tabs'
        instructions: 'Which tabs the section library offers. Requires the section library itself to be on.'
        fields:
          -
            handle: library_page
            field:
              type: toggle
              display: Page
              instructions: 'This site''s own section types.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
                sections: 'equals true'
          -
            handle: library_custom
            field:
              type: toggle
              display: Custom
              instructions: 'Saved sections, inserted as an independent copy.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
                sections: 'equals true'
          -
            handle: previews_autowatch
            field:
              type: toggle
              display: 'Auto-update previews'
              instructions: 'The default for the toggle in the Patterns bar. Automatic: once a minute while Live Preview is open, retake the previews that changed. Manual: a save button does it. Each editor can switch for themselves.'
              default: false
              width: 50
              if:
                enabled: 'equals true'
                sections: 'equals true'
          -
            handle: library_global
            field:
              type: toggle
              display: Global
              instructions: 'Synced sections — editing one changes every page using it.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
                sections: 'equals true'
          -
            handle: library_templates
            field:
              type: toggle
              display: Compositions
              instructions: 'Whole pages saved as a stack of sections to reuse.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
                sections: 'equals true'
      -
        display: 'What editors may build with'
        instructions: 'Holding the library to the designs the site already has, so a page cannot quietly grow a look nothing else uses.'
        fields:
          -
            handle: library_in_use_only
            field:
              type: toggle
              display: 'Limit the library to what the site already uses'
              instructions: "Only the sections this site already has somewhere are offered. Section types and global sections are found by scanning the pages. Custom sections and compositions are copied on insert and leave nothing behind to scan for, so they are judged by what they are built from — offered while every section in them is a design the site uses. Nothing is narrowed until the scan below has been run at least once."
              default: false
              if:
                enabled: 'equals true'
                sections: 'equals true'
          -
            handle: library_in_use_only_scope
            field:
              type: button_group
              display: 'Applies to'
              instructions: "Being a super admin is no exemption on its own — pick Everyone to see for yourself what an editor sees. You cannot lock yourself out: this screen is not governed by the setting."
              default: everyone
              options:
                everyone: Everyone
                roles: 'Only certain roles'
              if:
                enabled: 'equals true'
                sections: 'equals true'
                library_in_use_only: 'equals true'
          -
            handle: library_in_use_only_roles
            field:
              type: user_roles
              display: Roles
              instructions: 'Anyone holding one of these sees the narrowed library; everyone else sees all of it. Roles rather than groups, because a role a user gets through their group counts too — so nobody slips past by holding it the other way. Name none and the limit applies to nobody.'
              mode: select
              if:
                enabled: 'equals true'
                sections: 'equals true'
                library_in_use_only: 'equals true'
                library_in_use_only_scope: 'equals roles'
          -
            handle: library_scan
            field:
              type: library_scan
              display: 'Scan the site'
              instructions: "Reads every page and writes down the sections it finds. That list is the limit until you run this again — it never widens by itself, so a design added later stays out of reach until you say otherwise."
              if:
                enabled: 'equals true'
                sections: 'equals true'
                library_in_use_only: 'equals true'
      -
        display: 'Screen sizes'
        instructions: "The sizes this site designs for. One list: the preview's device buttons, the responsive fields, the Tailwind row and the CSS panel all read it, so they can never offer different ones. Desktop-first by default — the widest is written with no media query at all, and the narrower ones are exceptions from it; Direction below can turn that around. Leave it empty to use the three that ship with the addon."
        fields:
          -
            handle: breakpoint_direction
            field:
              type: button_group
              display: Direction
              default: desktop
              options:
                desktop: Desktop-first
                mobile: Mobile-first
              instructions: "Desktop-first: the widest size is the base and is written with no media query; every narrower size is an exception under `max-width` (Tailwind `max-lg:`). Mobile-first: the narrowest size is the base and every wider size is an exception under `min-width` (Tailwind `lg:`). **Decide this when the site is started.** Switching later turns every saved `max-lg:` class and every empty responsive value on its head — that is a migration, not a toggle."
          -
            handle: breakpoints
            field:
              type: grid
              display: Breakpoints
              hide_display: true
              mode: stacked
              reorderable: false
              max_rows: 5
              instructions: "Order does not matter here — the list is sorted by width, widest first, and the widest becomes the base. **Handle is the key your content is stored under: add freely, but renaming or deleting one leaves every entry's saved values for that size with no owner.** Five at most."
              add_row: 'Add a screen size'
              default:
                -
                  handle: laptop
                  label: desktop
                  device: Desktop
                  icon: desktop
                  min: 64
                  unit: em
                  width: 1440
                  height: 900
                -
                  handle: tablet
                  label: tablet
                  device: Tablet
                  icon: tablet
                  min: 48
                  unit: em
                  width: 810
                  height: 1080
                -
                  handle: mobile
                  label: mobile
                  device: Mobile
                  icon: mobile
                  min: 0
                  unit: em
                  width: 375
                  height: 812
              fields:
                -
                  handle: handle
                  field:
                    type: text
                    display: Handle
                    instructions: 'Lowercase, no spaces. This is the storage key — `laptop`, `tablet` and `mobile` are the ones already in your content.'
                    width: 33
                    validate:
                      - 'regex:/^[a-z][a-z0-9_]*$/'
                -
                  handle: label
                  field:
                    type: text
                    display: Name
                    instructions: 'What the button says. The three built-in ones translate themselves if you leave `desktop`, `tablet` or `mobile` here.'
                    width: 33
                -
                  handle: icon
                  field:
                    type: select
                    display: Icon
                    instructions: 'The picture on the device button.'
                    width: 34
                    default: desktop
                    options:
                      mobile: Mobile
                      mobile_landscape: 'Mobile (landscape)'
                      tablet: Tablet
                      tablet_landscape: 'Tablet (landscape)'
                      laptop: Laptop
                      desktop: Desktop
                      widescreen: Widescreen
                      ultrawide: Ultrawide
                      tv: TV
                -
                  handle: min
                  field:
                    type: float
                    display: 'From width'
                    instructions: "The narrowest screen that still counts as this size. The media query is worked out from it and from the size above, so the two can never overlap. The narrowest size on the list should be 0."
                    width: 17
                -
                  handle: unit
                  field:
                    type: select
                    display: Unit
                    instructions: "**em** unless you have a reason. A boundary in `em` moves with the reader's own font-size setting, so a page reflows when the text is big enough to need it; one in `px` never moves. In a media query `em` and `rem` are the same thing — both measure against the browser's initial font size, never against `html { font-size }` — so the choice between those two is convention, not behaviour."
                    width: 17
                    default: em
                    options:
                      em: em
                      rem: rem
                      px: px
                -
                  handle: width
                  field:
                    type: integer
                    display: 'Preview width'
                    instructions: 'How wide the preview frame is on this button.'
                    width: 33
                -
                  handle: height
                  field:
                    type: integer
                    display: 'Preview height'
                    width: 33
                -
                  handle: device
                  field:
                    type: text
                    display: 'Device name'
                    instructions: "Live Preview's own name for the button. Leave it and the handle is used."
                    width: 100
                -
                  handle: shortcut
                  field:
                    type: sve_shortcut
                    display: Shortcut
                    instructions: 'Pressing it is a click on the size''s button. Empty follows the built-in one (Desktop ⌘D, Tablet ⌥⌘T, Mobile ⌘M; Ctrl on Windows); a size you add has none until you record one. Every editor can change their own under ⋮ → Shortcuts.'
                    width: 50
              if:
                enabled: 'equals true'
      -
        display: 'Header and footer'
        instructions: 'Stepping into the site chrome from the preview. Switch off where the header or footer is fixed and editors should leave it alone.'
        fields:
          -
            handle: chrome_header
            field:
              type: toggle
              display: 'Edit header'
              instructions: 'Clicking the header opens its design and settings.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
          -
            handle: chrome_footer
            field:
              type: toggle
              display: 'Edit footer'
              instructions: 'The same for the footer.'
              default: true
              width: 50
              if:
                enabled: 'equals true'
